# Snakemake >= 9 profile for SLURM (Phoenix, University of Adelaide)
# Requires: snakemake-executor-plugin-slurm (installed in ~/software/workflow)
# Usage: snakemake -s workflow/Snakefile --profile workflow/profiles/phoenix

executor: slurm

# SLURM logs; logs of successful jobs are deleted automatically
slurm-logdir: workflow/slurm

default-resources:
  slurm_account: coursework
  slurm_partition: icelake
  mem_mb: 2048
  runtime: 60           # minutes
  gres: "tmpfs:10G"     # override per rule via resources: gres="tmpfs:50G"
  tmpdir: system_tmpdir

# Job submission / scheduling
jobs: 100
max-jobs-per-timespan: "2/1s"
max-status-checks-per-second: 5
local-cores: 1
scheduler: greedy
latency-wait: 60

# Failure handling
retries: 0
keep-going: True
rerun-incomplete: True
rerun-triggers: [mtime, params]

# Software environments
software-deployment-method: conda
conda-prefix: /hpcfs/users/a1975386/envs

# Output
printshellcmds: True

# Keep temp files; clean up afterwards with --delete-temp-output
notemp: True
